# Actions for clicked URLs; unmatched URLs fall back to `open_url_with`.
# See https://sw.kovidgoyal.net/kitty/open_actions/

# Resolve relative paths first, then reuse the file-type rules below.
# ponytail: use native click focus; background opens must pass the source pane.
protocol file
url ^(?![A-Za-z][A-Za-z0-9+.-]*:|/)[^?#]+
action kitten relative_links.py ${URL}

# Open local images with the system default viewer. Pass a plain path instead
# of the file:// URL, since some viewers (e.g. oculante) can't parse file URLs.
protocol file
mime image/*
action launch --type=background xdg-open $FILE_PATH

# Open Markdown with Brave; xdg-open treats it as plain text and opens an editor.
protocol file
ext md,markdown
action launch --type=background brave $URL
